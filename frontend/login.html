<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyControl - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>MoneyControl</h1>
        <p class="subtitle" id="subtitle">Entre na sua conta</p>

        <form id="authForm">
            <input type="text" id="name" placeholder="Nome" maxlength="100" autocomplete="name" hidden>
            <input type="email" id="email" placeholder="E-mail" maxlength="150" autocomplete="email" required>
            <input type="password" id="password" placeholder="Senha" minlength="6" maxlength="72" autocomplete="current-password" required>
            <button type="submit" id="submitButton">Entrar</button>
        </form>

        <p id="message" class="message"></p>

        <p class="auth-toggle">
            <span id="toggleText">Não tem conta?</span>
            <button type="button" id="toggleButton" class="link-button">Cadastre-se</button>
        </p>
    </main>

    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
