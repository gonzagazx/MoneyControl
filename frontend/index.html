<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyControl</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extra.css">
</head>
<body>
    <header class="topbar">
        <h1>MoneyControl</h1>
        <div class="topbar-actions">
            <input type="month" id="month">
            <span id="userName" class="user-name"></span>
            <button type="button" id="logoutButton" class="btn-secondary">Sair</button>
        </div>
    </header>

    <main class="container">
        <section class="cards">
            <article class="card">
                <span class="card-label">Saldo</span>
                <strong id="balance">R$ 0,00</strong>
            </article>
            <article class="card">
                <span class="card-label">Receitas</span>
                <strong id="income" class="positive">R$ 0,00</strong>
            </article>
            <article class="card">
                <span class="card-label">Despesas</span>
                <strong id="expense" class="negative">R$ 0,00</strong>
            </article>
        </section>

        <section class="forms">
            <article class="panel">
                <h2>Nova categoria</h2>
                <form id="categoryForm">
                    <input type="text" id="categoryName" placeholder="Nome da categoria" maxlength="100" required>
                    <select id="categoryType">
                        <option value="EXPENSE">Despesa</option>
                        <option value="INCOME">Receita</option>
                    </select>
                    <button type="submit">Adicionar</button>
                </form>
            </article>

            <article class="panel">
                <h2>Nova transação</h2>
                <form id="transactionForm">
                    <input type="text" id="description" placeholder="Descrição" maxlength="150" required>
                    <input type="number" id="amount" placeholder="Valor" step="0.01" min="0.01" required>
                    <input type="date" id="date" required>
                    <select id="categorySelect" required></select>
                    <button type="submit">Adicionar</button>
                </form>
            </article>
        </section>

        <p id="message" class="message"></p>

        <section class="grid">
            <article class="panel">
                <h2>Despesas por categoria</h2>
                <canvas id="categoryChart"></canvas>
            </article>

            <article class="panel">
                <h2>Transações</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th class="right">Valor</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="transactions"></tbody>
                </table>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
